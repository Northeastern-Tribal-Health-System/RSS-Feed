<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NTHS Lobby Display</title>
<!--
  NTHS lobby display for the UniFi Display Cast Pro (Web Mode).

  Layout (designed at 1920x1080, scales to whatever the player outputs):
    - Video zone, top left, 1600x900 (16:9). Black when no source is set, so a hardware
      picture-in-picture window from a TV box can sit exactly on top of it.
    - Info strip under the video, 1600x100: name, message, clock and date
    - Right panel, 320x1000: Miami, OK weather (current conditions and 7-period forecast)
    - Announcements ticker along the bottom, 1920x80, pulled from the NTHS RSS feed on GitHub

  Everything is set with URL parameters, so the page never needs editing. Example:
    signage.html?msg=Welcome%20to%20the%20Longhouse

  Parameters (all optional):
    rss          RSS or Atom feed URL (default: the NTHS feed on GitHub Pages)
    label        Ticker label text (default: Announcements)
    speed        Ticker speed in pixels per second (default: 110)
    rssrefresh   Minutes between feed reloads (default: 10)
    wx           weather.gov grid point, OFFICE/X,Y (default: TSA/81,137 = Miami, OK)
    wxname       Weather panel heading (default: Miami, OK Weather)
    wxrefresh    Minutes between forecast reloads (default: 30)
    web          URL to show in the right panel instead of the weather (the site must allow framing)
    webzoom      Scale for that page, e.g. 0.75 (default: 1)
    webrefresh   Minutes between reloads of that page (default: 15, 0 = never)
    yt           YouTube video ID, for content you have rights to show
    ytchannel    YouTube channel ID (UC...), plays whatever that channel has live
    ytlist       YouTube playlist ID
    stream       HLS (.m3u8) or MP4 URL, e.g. from an encoder
    mute         1 = muted (default, needed for autoplay), 0 = sound on. If the
                 browser blocks sound, the video plays muted instead.
    videorefresh Minutes between video reloads to recover a stalled stream (default: 240, 0 = never)
    title        Heading in the info strip
    msg          Message in the info strip
    tz           Time zone for the clocks (default: America/Chicago)
    reloadhour   Hour (0-23) for a full page reload each day (default: 3, -1 = never)
    selfupdate   Minutes between checks for a newer version of this page on GitHub; reloads
                 automatically when one is found (default: 10, 0 = never)
    trivia       1 = play a short trivia break between Jellyfin videos (default: 0 = off)
    triviaevery  Minutes between trivia breaks (default: 30). A break only starts when a
                 video ends, never in the middle of one. 0 = after every video, for testing.
    triviaitems  Items per break (default: 3, e.g. two questions and a fun fact)
    triviaq      Seconds a question or fun fact stays up (default: 12; a word of the day gets 3 more)
    triviaa      Seconds an answer stays up (default: 10)
    triviafile   Trivia file (default: trivia.json next to this page; edit it to change the trivia)
    ads          Commercial breaks between Jellyfin videos (default: 1 = on, 0 = off). A break
                 opens with one clinic promo from promolib, then vintage spots from adslib
                 fill the rest of the break. Each library plays in a shuffle, every item once
                 before any repeats. A library that is missing, empty, or hidden from the
                 signage user is skipped; with nothing in either, no break plays.
    promolib     Library of clinic promos: videos, or flyer images (default: Clinic Promos;
                 none = no promos). A file named with "until 2026-12-15" stops showing after
                 that day; "from 2026-12-01" waits until that day.
    promosecs    Seconds a flyer image stays up (default: 12)
    adslib       Library of vintage spots (default: Commercials; none = no vintage spots)
    adsevery     Minutes between breaks (default: 15). Like trivia, a break only starts when
                 a video ends. 0 = after every video, for testing.
    adsmax       Seconds per break (default: 150). There is always at least one item.
    resumehours  After a reload or power cycle, a Jellyfin video that was cut off picks up
                 where it stopped if that was less than this many hours ago (default: 2),
                 so each morning starts with a fresh video instead of yesterday's last one.
-->
<style>
  :root {
    --bg: #13241a;
    --panel: #1b3324;
    --accent: #4f7350;
    --accent-bright: #9fd3a0;
    --text: #f3f6f1;
    --muted: #b8c8ba;
    --ticker-bg: #0a130e;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    cursor: none;
  }
  body {
    font-family: "Segoe UI", Roboto, "Open Sans", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
  }
  #stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    transform-origin: 0 0;
    background: var(--bg);
    overflow: hidden;
  }

  /*
    Layout at 1920x1080:
      video   0,0      1600 x 900  (16:9)
      info    0,900    1600 x 100
      side    1600,0    320 x 1000
      ticker  0,1000   1920 x 80
  */

  /* Video zone */
  #video {
    position: absolute;
    left: 0;
    top: 0;
    width: 1600px;
    height: 900px;
    background: #000;
    overflow: hidden;
  }
  #video iframe, #video video {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #000;
  }
  #video img.flyer {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #000;
    animation: trivia-in 0.6s ease-out both;
  }
  #cc {
    position: absolute;
    left: 100px;
    right: 100px;
    bottom: 48px;
    text-align: center;
    pointer-events: none;
    visibility: hidden;
    z-index: 5;
  }
  #cc span {
    display: inline;
    white-space: pre-line;
    color: #fff;
    background: rgba(0, 0, 0, 0.78);
    font: 600 40px/1.4 Arial, Helvetica, sans-serif;
    padding: 2px 14px;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }
  /* Trivia breaks, in the video zone; same look as the Lobby Trivia deck */
  .trivia {
    position: absolute;
    left: 0;
    top: 0;
    width: 1600px;
    height: 900px;
    box-sizing: border-box;
    padding: 96px 104px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    font-family: Roboto, "Segoe UI", "Open Sans", Arial, sans-serif;
    animation: trivia-in 0.6s ease-out both;
  }
  .trivia p { margin: 0; }
  .tv-eyebrow { font-size: 30px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .tv-rule { width: 116px; height: 8px; border-radius: 4px; }
  .tv-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 32px; }
  .tv-main { font-size: 70px; font-weight: 700; line-height: 1.15; }
  .tv-sub { font-size: 36px; line-height: 1.35; }
  .trivia.q { background: #13241a; }
  .trivia.q .tv-eyebrow { color: #ffd54a; }
  .trivia.q .tv-rule { background: #ffd54a; }
  .trivia.q .tv-main { color: #f3f6f1; }
  .trivia.q .tv-sub { color: #b8c8ba; font-size: 30px; }
  .trivia.a { background: #f1ecc8; }
  .trivia.a .tv-eyebrow { color: #2f4a33; }
  .trivia.a .tv-rule { background: #4f7350; }
  .trivia.a .tv-main { color: #13241a; font-size: 100px; font-weight: 900; line-height: 1.05; }
  .trivia.a .tv-sub { color: #2c3d30; }
  .trivia.fact { background: #9fd3a0; }
  .trivia.fact .tv-eyebrow { color: #13241a; }
  .trivia.fact .tv-rule { background: #13241a; }
  .trivia.fact .tv-main { color: #13241a; }
  .trivia.word { background: #1b3324; }
  .trivia.word .tv-eyebrow { color: #9fd3a0; }
  .trivia.word .tv-rule { background: #9fd3a0; }
  .trivia.word .tv-main { color: #f1ecc8; font-size: 110px; font-weight: 900; line-height: 1.05; }
  .trivia.word .tv-sub { color: #f3f6f1; font-size: 44px; }
  .trivia.word .tv-pos { color: #ffd54a; font-style: italic; margin-right: 14px; }
  .trivia.word .tv-ex { color: #b8c8ba; font-size: 34px; font-style: italic; }
  @keyframes trivia-in { from { opacity: 0; } }

  #dbg {
    position: absolute;
    right: 8px;
    bottom: 88px;
    width: 304px;
    box-sizing: border-box;
    z-index: 50;
    background: rgba(0, 0, 0, 0.85);
    color: #9fd3a0;
    font: 14px/1.35 monospace;
    padding: 8px 10px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Info strip */
  #info {
    position: absolute;
    left: 0;
    top: 900px;
    width: 1600px;
    height: 100px;
    box-sizing: border-box;
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    background: linear-gradient(135deg, var(--panel) 0%, var(--bg) 100%);
    border-top: 4px solid var(--accent);
  }
  #info-text {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
    white-space: nowrap;
    overflow: hidden;
  }
  #info-title {
    font-size: 32px;
    font-weight: 700;
    line-height: 1.1;
    margin: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #info-msg {
    font-size: 22px;
    color: var(--muted);
    line-height: 1.2;
    margin: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #clock {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    gap: 20px;
  }
  #clock-time {
    font-size: 52px;
    font-weight: 300;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #clock-date {
    font-size: 24px;
    color: var(--accent-bright);
  }

  /* Right panel */
  #side {
    position: absolute;
    left: 1600px;
    top: 0;
    width: 320px;
    height: 1000px;
    overflow: hidden;
    border-left: 4px solid var(--accent);
    box-sizing: border-box;
    background: linear-gradient(160deg, var(--panel) 0%, var(--bg) 100%);
    color: var(--text);
  }
  #side iframe {
    border: 0;
    display: block;
    transform-origin: 0 0;
    background: #fff;
  }

  /* Weather */
  .wx {
    position: absolute;
    inset: 0;
    padding: 20px 16px 14px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .wx-head {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent-bright);
    padding-bottom: 10px;
    margin: 0 0 14px 0;
    border-bottom: 3px solid var(--accent);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .wx-now {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .wx-now-icon svg { width: 84px; height: 84px; display: block; }
  .wx-now-temp {
    font-size: 84px;
    font-weight: 300;
    line-height: 1;
  }
  .wx-now-text {
    margin: 6px 0 16px 0;
    min-width: 0;
  }
  .wx-now-label {
    font-size: 16px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .wx-now-desc {
    font-size: 22px;
    margin-top: 2px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .wx-list {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 8px;
    overflow: hidden;
  }
  .wx-row {
    flex: 1 1 0;
    min-height: 0;
    max-height: 104px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 10px 0 10px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
    border-left: 4px solid var(--accent);
  }
  .wx-row .i svg { width: 44px; height: 44px; display: block; }
  .wx-row .n { flex: 1; min-width: 0; }
  .wx-row .n b {
    display: block;
    font-size: 20px;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .wx-row .n small {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    font-size: 16px;
    line-height: 1.2;
    color: var(--muted);
    overflow: hidden;
  }
  .wx-row .tp {
    flex: 0 0 auto;
    text-align: right;
  }
  .wx-row .t {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.1;
    color: var(--accent-bright);
  }
  .wx-row .p {
    font-size: 15px;
    color: var(--muted);
  }
  .wx-foot {
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    margin-top: 10px;
  }

  /* Ticker */
  #ticker {
    position: absolute;
    left: 0;
    top: 1000px;
    width: 1920px;
    height: 80px;
    background: var(--ticker-bg);
    border-top: 4px solid var(--accent);
    box-sizing: border-box;
    display: flex;
  }
  #ticker-label {
    flex: 0 0 auto;
    padding: 0 30px;
    background: var(--accent);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    z-index: 1;
  }
  #ticker-window {
    position: relative;
    flex: 1;
    overflow: hidden;
  }
  #ticker-track {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    display: flex;
    align-items: center;
    white-space: nowrap;
    font-size: 34px;
    will-change: transform;
  }
  .t-title {
    font-weight: 700;
    color: var(--accent-bright);
  }
  .t-sep {
    color: var(--accent);
    padding: 0 40px;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="video"></div>
  <div id="info">
    <div id="info-text">
      <p id="info-title"></p>
      <p id="info-msg"></p>
    </div>
    <div id="clock">
      <div id="clock-time"></div>
      <div id="clock-date"></div>
    </div>
  </div>
  <div id="side"></div>
  <div id="ticker">
    <div id="ticker-label"></div>
    <div id="ticker-window"><div id="ticker-track"></div></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Settings ----------
  var cfg = {
    rss: "https://northeastern-tribal-health-system.github.io/RSS-Feed/rss.xml",
    label: "Announcements",
    speed: "110",
    rssrefresh: "10",
    wx: "TSA/81,137",
    wxname: "Miami, OK Weather",
    wxrefresh: "30",
    web: "",
    webzoom: "1",
    webrefresh: "15",
    yt: "",
    ytchannel: "",
    ytlist: "",
    stream: "",
    jf: "https://media.ad.nthsclinic.com",
    jftoken: "",
    jflib: "Longhouse",
    jforder: "shuffle",
    jfrefresh: "30",
    resumehours: "2",
    cc: "1",
    mute: "1",
    videorefresh: "240",
    title: "Northeastern Tribal Health System",
    msg: "Welcome! Please check in at the front desk.",
    tz: "America/Chicago",
    reloadhour: "3",
    selfupdate: "10",
    trivia: "0",
    triviaevery: "30",
    triviaitems: "3",
    triviaq: "12",
    triviaa: "10",
    triviafile: "trivia.json",
    ads: "1",
    promolib: "Clinic Promos",
    promosecs: "12",
    adslib: "Commercials",
    adsevery: "15",
    adsmax: "150"
  };
  var extra = window.SIGNAGE_CONFIG || {};
  Object.keys(extra).forEach(function (k) { cfg[k] = String(extra[k]); });
  new URLSearchParams(location.search).forEach(function (v, k) { cfg[k] = v; });

  // The Jellyfin token only has to be in the URL once per player. It is saved on
  // the player, so later URLs (and UniFi automations) can just name the library.
  (function () {
    var key = "nths-signage-jftoken";
    if (cfg.jftoken) {
      store(key, cfg.jftoken);
    } else if (new URLSearchParams(location.search).has("jflib")) {
      cfg.jftoken = recall(key) || "";
      if (!cfg.jftoken) {
        console.warn("No Jellyfin token saved on this player; open the URL once with &jftoken=");
        debugLine("jellyfin", "no token saved on this player yet");
      }
    }
  })();

  function num(v, fallback) {
    var n = parseFloat(v);
    return isFinite(n) ? n : fallback;
  }
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined) { e.textContent = text; }
    return e;
  }
  function store(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }
  function recall(key) {
    try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; }
  }

  // ---------- Scale the 1920x1080 stage to the screen ----------
  var stage = $("stage");
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    var dx = (window.innerWidth - 1920 * s) / 2;
    var dy = (window.innerHeight - 1080 * s) / 2;
    stage.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  // ---------- Time helpers (local time in cfg.tz, DST handled by the browser) ----------
  function zoned(now) {
    var parts = {};
    try {
      new Intl.DateTimeFormat("en-US", {
        timeZone: cfg.tz, hour: "numeric", minute: "numeric", second: "numeric", hour12: false
      }).formatToParts(now).forEach(function (p) { parts[p.type] = p.value; });
      return { h: parseInt(parts.hour, 10) % 24, m: parseInt(parts.minute, 10), s: parseInt(parts.second, 10) };
    } catch (e) {
      return { h: now.getHours(), m: now.getMinutes(), s: now.getSeconds() };
    }
  }
  function fmtTime(d) {
    try { return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: cfg.tz }); }
    catch (e) { return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); }
  }
  function fmtDate(d) {
    try { return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", timeZone: cfg.tz }); }
    catch (e) { return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }); }
  }

  // ---------- Info strip and digital clock ----------
  $("info-title").textContent = cfg.title;
  $("info-msg").textContent = cfg.msg;
  $("ticker-label").textContent = cfg.label;
  function updateClock() {
    var now = new Date();
    $("clock-time").textContent = fmtTime(now);
    $("clock-date").textContent = fmtDate(now);
  }
  updateClock();
  setInterval(updateClock, 10000);

  // ---------- Video zone ----------
  var videoBox = $("video");

  function youtubeSrc() {
    var common = "autoplay=1&mute=" + (cfg.mute === "0" ? "0" : "1") +
      "&controls=0&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&disablekb=1&fs=0";
    if (cfg.yt) {
      var id = encodeURIComponent(cfg.yt);
      return "https://www.youtube.com/embed/" + id + "?" + common + "&loop=1&playlist=" + id;
    }
    if (cfg.ytchannel) {
      return "https://www.youtube.com/embed/live_stream?channel=" + encodeURIComponent(cfg.ytchannel) + "&" + common;
    }
    if (cfg.ytlist) {
      return "https://www.youtube.com/embed/videoseries?list=" + encodeURIComponent(cfg.ytlist) + "&" + common + "&loop=1";
    }
    return "";
  }

  function loadScript(src, cb) {
    var s = document.createElement("script");
    s.src = src;
    s.onload = function () { cb(null); };
    s.onerror = function () { cb(new Error("load failed")); };
    document.head.appendChild(s);
  }

  var hlsInstance = null;
  function startStream() {
    videoBox.innerHTML = "";
    if (hlsInstance) { try { hlsInstance.destroy(); } catch (e) {} hlsInstance = null; }
    var v = document.createElement("video");
    v.autoplay = true;
    v.muted = cfg.mute !== "0";
    v.loop = true;
    v.playsInline = true;
    v.setAttribute("playsinline", "");
    videoBox.appendChild(v);
    var url = cfg.stream;
    var isHls = /\.m3u8(\?|$)/i.test(url);
    if (!isHls || v.canPlayType("application/vnd.apple.mpegurl")) {
      v.src = url;
      playOrMute(v);
    } else {
      loadScript("https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js", function (err) {
        if (err || !window.Hls || !window.Hls.isSupported()) {
          console.warn("HLS playback not supported on this player");
          return;
        }
        hlsInstance = new window.Hls({ liveSyncDurationCount: 3 });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(v);
        hlsInstance.on(window.Hls.Events.MANIFEST_PARSED, function () { playOrMute(v); });
        hlsInstance.on(window.Hls.Events.ERROR, function (evt, data) {
          if (data && data.fatal) { setTimeout(startStream, 15000); }
        });
      });
    }
    v.addEventListener("error", function () { setTimeout(startStream, 15000); });
    v.addEventListener("ended", function () { setTimeout(startStream, 2000); });
  }

  // ---------- Jellyfin playlist ----------
  // jftoken = the signage user's access token, jflib = library name.
  // Plays every video in the library once, in random order (or by name with
  // jforder=name), before any video repeats; then starts a new round. The round
  // and the spot in the current video are saved on the player, so a reload or a
  // power cycle picks up where it left off. New videos join the current round
  // when the library is re-read (every jfrefresh minutes); failures are skipped.
  var jfState = { userId: "", libId: "", items: [], byId: {}, queue: [], played: [],
                  curId: "", loadedAt: 0, fails: 0, video: null, lastId: "", restored: false, resume: null };
  var JF_SAVE_KEY = "nths-signage-jf:" + String(cfg.jflib).toLowerCase();

  function jfSave() {
    var v = jfState.video;
    store(JF_SAVE_KEY, {
      queue: jfState.queue.slice(), played: jfState.played.slice(), cur: jfState.curId,
      pos: v && !v.ended ? Math.floor(v.currentTime || 0) : 0, at: Date.now()
    });
  }

  function jfUrl(path, params) {
    var q = new URLSearchParams(params || {});
    q.set("ApiKey", cfg.jftoken);
    return cfg.jf.replace(/\/+$/, "") + path + "?" + q.toString();
  }

  function jfJson(path, params) {
    return fetch(jfUrl(path, params), { cache: "no-store" })
      .then(function (r) { if (!r.ok) { throw new Error("Jellyfin HTTP " + r.status + " on " + path); } return r.json(); });
  }

  function jfShuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function jfLoadLibrary() {
    var userStep = jfState.userId ? Promise.resolve(jfState.userId) :
      jfJson("/Users/Me").then(function (me) { jfState.userId = me.Id; return me.Id; });
    return userStep.then(function (uid) {
      return jfJson("/UserViews", { userId: uid }).then(function (views) {
        var want = String(cfg.jflib).toLowerCase();
        var lib = (views.Items || []).filter(function (v) { return String(v.Name).toLowerCase() === want; })[0];
        if (!lib) { throw new Error("Jellyfin library not found: " + cfg.jflib); }
        jfState.libId = lib.Id;
        return jfJson("/Items", {
          userId: uid, parentId: lib.Id, recursive: "true",
          includeItemTypes: "Video,Movie,Episode,MusicVideo",
          fields: "MediaSources", sortBy: "SortName", sortOrder: "Ascending"
        });
      });
    }).then(function (res) {
      jfState.items = (res.Items || []).filter(function (it) { return it.MediaSources && it.MediaSources.length; });
      jfState.byId = {};
      jfState.items.forEach(function (it) { jfState.byId[it.Id] = it; });
      jfMergeRound();
      jfState.loadedAt = Date.now();
      debugLine("library", cfg.jflib + ", " + jfState.items.length + (jfState.items.length === 1 ? " video, " : " videos, ") + jfState.queue.length + " left this round");
      return jfState.items.length;
    });
  }

  // Keep the current round across reloads and library changes: drop videos that
  // are gone, and slot new ones into random places in what is left of the round.
  function jfMergeRound() {
    var have = jfState.byId;
    if (!jfState.restored) {
      jfState.restored = true;
      var saved = recall(JF_SAVE_KEY);
      if (saved && Date.now() - (saved.at || 0) < 3 * 86400000) {
        jfState.queue = (saved.queue || []).filter(function (id) { return have[id]; });
        jfState.played = (saved.played || []).filter(function (id) { return have[id]; });
        if (saved.cur && have[saved.cur] && Date.now() - saved.at < num(cfg.resumehours, 2) * 3600000) {
          jfState.resume = { id: saved.cur, pos: saved.pos || 0 };
        }
      }
    }
    jfState.queue = jfState.queue.filter(function (id) { return have[id]; });
    jfState.played = jfState.played.filter(function (id) { return have[id]; });
    var known = {};
    jfState.queue.concat(jfState.played).forEach(function (id) { known[id] = true; });
    if (jfState.resume) { known[jfState.resume.id] = true; }
    jfState.items.forEach(function (it) {
      if (known[it.Id]) { return; }
      if (cfg.jforder === "name") {
        jfState.queue.push(it.Id);
      } else {
        jfState.queue.splice(Math.floor(Math.random() * (jfState.queue.length + 1)), 0, it.Id);
      }
    });
  }

  function jfNextItem() {
    if (!jfState.queue.length) {
      // new round: every video once, the last one played never first
      var ids = jfState.items.map(function (it) { return it.Id; });
      jfState.queue = cfg.jforder === "name" ? ids : jfShuffle(ids);
      jfState.played = [];
      if (jfState.queue.length > 1 && jfState.queue[0] === jfState.lastId) { jfState.queue.push(jfState.queue.shift()); }
    }
    var id = jfState.queue.shift();
    jfState.played.push(id);
    return jfState.byId[id];
  }

  function jfPlayNext() {
    var stale = Date.now() - jfState.loadedAt > num(cfg.jfrefresh, 30) * 60000;
    var ready = (!jfState.items.length || stale) ? jfLoadLibrary() : Promise.resolve(jfState.items.length);
    ready.then(function (count) {
      if (!count) { throw new Error("Jellyfin library is empty: " + cfg.jflib); }
      var r = jfState.resume;
      jfState.resume = null;
      if (r && jfState.byId[r.id]) {
        jfPlayItem(jfState.byId[r.id], r.pos);
      } else {
        jfPlayItem(jfNextItem(), 0);
      }
    }).catch(function (e) {
      console.warn(e.message || e);
      debugLine("jellyfin", String(e.message || e) + " (trying again in 1 min)");
      jfState.items = [];
      setTimeout(jfPlayNext, 60000);
    });
  }

  // ---------- Captions ----------
  // Drawn by the page itself rather than the browser's <track> support, which
  // behaves differently from player to player and needs extra CORS on video.
  function vttSeconds(h, m, s, ms) {
    return (h ? parseInt(h, 10) * 3600 : 0) + parseInt(m, 10) * 60 + parseInt(s, 10) + parseInt(ms, 10) / 1000;
  }

  function decodeEntities(t) {
    return t.replace(/&nbsp;/g, " ").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      .replace(/&quot;/g, "\"").replace(/&#39;/g, "'").replace(/&amp;/g, "&");
  }

  function parseVtt(txt) {
    var cues = [];
    var timing = /^(\d{1,2}:)?(\d{1,2}):(\d{2})[.,](\d{3})\s+-->\s+(\d{1,2}:)?(\d{1,2}):(\d{2})[.,](\d{3})/;
    String(txt).replace(/\r/g, "").split(/\n\s*\n/).forEach(function (block) {
      var lines = block.split("\n");
      for (var i = 0; i < lines.length; i++) {
        var m = lines[i].match(timing);
        if (m) {
          var text = decodeEntities(lines.slice(i + 1).join("\n").replace(/<[^>]+>/g, "")).trim();
          if (text) {
            cues.push({ s: vttSeconds(m[1], m[2], m[3], m[4]), e: vttSeconds(m[5], m[6], m[7], m[8]), t: text });
          }
          break;
        }
      }
    });
    cues.sort(function (a, b) { return a.s - b.s; });
    return cues;
  }

  function clockText(sec) {
    sec = Math.floor(sec);
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  var ccRun = 0;
  function showCaptions(v, cues) {
    var run = ++ccRun;
    var box = el("div", "", "");
    box.id = "cc";
    var span = el("span", "", "");
    box.appendChild(span);
    videoBox.appendChild(box);
    var idx = 0, shownText = null;
    function tick() {
      if (run !== ccRun || !v.isConnected) { return; }
      var t = v.currentTime;
      if (idx >= cues.length || (idx > 0 && cues[idx - 1].s > t)) { idx = 0; }
      while (idx < cues.length && cues[idx].e <= t) { idx++; }
      var cue = cues[idx];
      var text = cue && cue.s <= t ? cue.t : "";
      if (text !== shownText) {
        span.textContent = text;
        box.style.visibility = text ? "visible" : "hidden";
        shownText = text;
        if (text) {
          debugLine("on screen", text.replace(/\n/g, " ").slice(0, 60));
        } else {
          debugLine("on screen", cue ? "nothing until " + clockText(cue.s) : "no more captions in this video");
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  // Browsers often refuse to start a video with sound until someone has touched
  // the page. If that happens, play it muted rather than not at all.
  function playOrMute(v) {
    var p = v.play();
    if (!p || !p.then) { return; }
    p.then(function () {
      debugLine("sound", v.muted ? "muted (mute=0 in the URL turns it on)" : "on");
    }).catch(function (e) {
      if (!v.muted && e && e.name === "NotAllowedError") {
        v.muted = true;
        debugLine("sound", "this browser blocked sound, so it plays muted");
        v.play().catch(function () {});
      }
    });
  }

  function debugLine(key, val) {
    if (cfg.debug !== "1") { return; }
    var d = $("dbg");
    if (!d) { d = el("div", "", ""); d.id = "dbg"; ($("stage") || document.body).appendChild(d); }
    debugLine.state = debugLine.state || {};
    debugLine.state[key] = val;
    d.textContent = Object.keys(debugLine.state).map(function (k) { return k + ": " + debugLine.state[k]; }).join("\n");
  }

  // A fresh video element for a Jellyfin item, with its captions loading.
  function jfVideoFor(item) {
    var ms = item.MediaSources[0];
    var subs = (ms.MediaStreams || []).filter(function (s) { return s.Type === "Subtitle" && s.IsTextSubtitleStream; });
    var useCc = cfg.cc !== "0" && subs.length > 0;
    ccRun++;
    videoBox.innerHTML = "";
    var v = document.createElement("video");
    v.autoplay = true;
    v.muted = cfg.mute !== "0";
    v.playsInline = true;
    v.setAttribute("playsinline", "");
    v.preload = "auto";
    debugLine("playing", item.Name);
    debugLine("captions", useCc ? "loading" : (cfg.cc === "0" ? "turned off" : "none for this video"));
    if (useCc) {
      fetch(jfUrl("/Videos/" + item.Id + "/" + ms.Id + "/Subtitles/" + subs[0].Index + "/0/Stream.vtt"), { cache: "no-store" })
        .then(function (r) { if (!r.ok) { throw new Error("HTTP " + r.status); } return r.text(); })
        .then(function (txt) {
          var cues = parseVtt(txt);
          debugLine("captions", cues.length + (cues.length === 1 ? " line" : " lines"));
          if (cues.length && jfState.video === v) { showCaptions(v, cues); }
        })
        .catch(function (e) {
          console.warn("Captions failed for " + item.Name + ": " + e.message);
          debugLine("captions", "failed: " + e.message);
        });
    }
    v.src = jfUrl("/Videos/" + item.Id + "/stream", { static: "true", mediaSourceId: ms.Id });
    return v;
  }

  function jfPlayItem(item, startAt) {
    jfState.curId = item.Id;
    var v = jfVideoFor(item);
    if (startAt > 5) {
      // resume a few seconds early, unless the video was nearly over
      v.addEventListener("loadedmetadata", function () {
        if (!v.duration || startAt < v.duration - 15) { v.currentTime = Math.max(0, startAt - 3); }
      });
      debugLine("resumed", item.Name + " at " + Math.round(startAt) + "s");
    }
    var lastSave = 0;
    v.addEventListener("playing", function () { jfState.fails = 0; jfState.lastId = item.Id; debugLine("video", "playing"); jfSave(); });
    v.addEventListener("timeupdate", function () {
      var now = Date.now();
      if (now - lastSave > 10000) { lastSave = now; jfSave(); }
    });
    v.addEventListener("ended", function () {
      jfState.curId = "";
      jfSave();
      afterShow();
    });
    v.addEventListener("error", function () {
      debugLine("video", "error " + (v.error ? v.error.code : "?"));
      jfState.fails += 1;
      console.warn("Jellyfin video failed: " + item.Name);
      var wait = jfState.fails >= Math.max(3, jfState.items.length) ? 60000 : 3000;
      if (wait > 3000) { jfState.items = []; jfState.fails = 0; }
      setTimeout(jfPlayNext, wait);
    });
    videoBox.appendChild(v);
    jfState.video = v;
    playOrMute(v);
  }

  // ---------- Trivia breaks ----------
  // With trivia=1, a short break of questions, answers and fun facts from
  // trivia.json plays after a video ends, once triviaevery minutes have passed
  // since the last break. It never cuts into a video. The time of the last
  // break and the next item to show are saved on the player, so a reload
  // neither repeats a break nor starts the trivia over.
  var TRIVIA_KEY = "nths-signage-trivia:" + String(cfg.jflib).toLowerCase();
  var triviaItems = [];

  function triviaState() {
    var s = recall(TRIVIA_KEY) || {};
    if (!s.last) { s.last = Date.now(); s.next = s.next || 0; store(TRIVIA_KEY, s); }
    return s;
  }

  function triviaDue() {
    if (cfg.trivia !== "1") { return false; }
    return Date.now() - triviaState().last >= num(cfg.triviaevery, 30) * 60000;
  }

  function triviaNote() {
    if (cfg.trivia !== "1") { return; }
    var every = num(cfg.triviaevery, 30);
    var mins = Math.max(0, Math.ceil((triviaState().last + every * 60000 - Date.now()) / 60000));
    debugLine("trivia", "every " + every + " min, " + (mins ? "next break when a video ends " + mins + "+ min from now" : "next break when this video ends"));
  }

  // Read the file again for every break, so edits show up without a reload.
  function fetchTrivia() {
    return fetch(cfg.triviafile, { cache: "no-store" })
      .then(function (r) { if (!r.ok) { throw new Error("HTTP " + r.status); } return r.json(); })
      .then(function (data) {
        var items = (data.items || []).filter(function (it) {
          if (!it) { return false; }
          if (it.type === "fact") { return !!it.text; }
          if (it.type === "word") { return !!(it.word && it.def); }
          return !!(it.q && it.a);
        });
        if (items.length) { triviaItems = items; }
        return triviaItems;
      })
      .catch(function (e) {
        console.warn("Trivia file failed: " + e.message);
        return triviaItems;
      });
  }

  function triviaSlide(sl) {
    var box = el("div", "trivia " + sl.kind);
    box.appendChild(el("p", "tv-eyebrow", sl.eyebrow));
    box.appendChild(el("div", "tv-rule"));
    var body = el("div", "tv-body");
    body.appendChild(el("p", "tv-main", sl.main));
    if (sl.sub) {
      var sub = el("p", "tv-sub");
      if (sl.pos) { sub.appendChild(el("span", "tv-pos", sl.pos)); }
      sub.appendChild(document.createTextNode(sl.sub));
      body.appendChild(sub);
    }
    if (sl.ex) { body.appendChild(el("p", "tv-ex", sl.ex)); }
    box.appendChild(body);
    return box;
  }

  function playTrivia(done) {
    var s = triviaState();
    s.last = Date.now();
    store(TRIVIA_KEY, s);
    ccRun++;
    jfState.video = null;
    fetchTrivia().then(function (items) {
      if (!items.length) { debugLine("trivia", "no trivia to show"); done(); return; }
      var count = Math.min(items.length, Math.max(1, Math.round(num(cfg.triviaitems, 3))));
      var start = (s.next || 0) % items.length;
      var slides = [];
      for (var i = 0; i < count; i++) {
        var it = items[(start + i) % items.length];
        if (it.type === "fact") {
          slides.push({ kind: "fact", eyebrow: "Did you know?", main: it.text, secs: num(cfg.triviaq, 12) });
        } else if (it.type === "word") {
          slides.push({ kind: "word", eyebrow: "Word of the Day", main: it.word, pos: it.pos || "", sub: it.def,
                        ex: it.example || "", secs: num(cfg.triviaq, 12) + 3 });
        } else {
          slides.push({ kind: "q", eyebrow: "Trivia", main: it.q, sub: "Answer coming up", secs: num(cfg.triviaq, 12) });
          slides.push({ kind: "a", eyebrow: "Answer", main: it.a, sub: it.detail || "", secs: num(cfg.triviaa, 10) });
        }
      }
      s.next = (start + count) % items.length;
      store(TRIVIA_KEY, s);
      var n = 0;
      (function show() {
        if (n >= slides.length) {
          videoBox.innerHTML = "";
          triviaNote();
          done();
          return;
        }
        var sl = slides[n++];
        videoBox.innerHTML = "";
        videoBox.appendChild(triviaSlide(sl));
        debugLine("trivia", "break, slide " + n + " of " + slides.length);
        setTimeout(show, Math.max(3, sl.secs) * 1000);
      })();
    });
  }

  // ---------- Commercial breaks ----------
  // With ads on (the default), a short break plays after a show ends, once
  // adsevery minutes have passed since the last one. It opens with one clinic
  // promo from promolib (a video, or a flyer image shown for promosecs seconds),
  // then vintage spots from adslib fill the rest of adsmax seconds. Each library
  // plays in a shuffle, every item once before any repeats, saved on the player.
  // A library that is missing or empty is skipped; with nothing in either, no
  // break plays. A file named with "until 2026-12-15" stops showing after that
  // day, and "from 2026-12-01" waits until that day.
  // Only one break follows a show: commercials if due, otherwise trivia if due.
  var BREAK_KEY = "nths-signage-breaks:" + String(cfg.jflib).toLowerCase();

  function spotSource(label, lib) {
    return { label: label, lib: String(lib || ""), key: "nths-signage-spots:" + String(lib || "").toLowerCase(),
             all: [], items: [], byId: {}, loadedAt: 0, note: "" };
  }
  var promoSrc = spotSource("promos", cfg.promolib);
  var adSrc = spotSource("spots", cfg.adslib);

  function libOff(name) {
    var n = String(name || "").toLowerCase();
    return !n || n === "none" || n === "0";
  }

  function todayYmd() {
    try {
      return new Intl.DateTimeFormat("en-CA", { timeZone: cfg.tz, year: "numeric", month: "2-digit", day: "2-digit" })
        .format(new Date()).replace(/[^0-9]/g, "");
    } catch (e) {
      var d = new Date();
      return String(d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate());
    }
  }

  function inDateWindow(it, today) {
    var name = (it.Name || "") + " " + (it.Path || "");
    var until = /until\s*(\d{4})-(\d{2})-(\d{2})/i.exec(name);
    var from = /from\s*(\d{4})-(\d{2})-(\d{2})/i.exec(name);
    if (until && today > until[1] + until[2] + until[3]) { return false; }
    if (from && today < from[1] + from[2] + from[3]) { return false; }
    return true;
  }

  function breakSaved() {
    var s = recall(BREAK_KEY) || {};
    if (!s.last) { s.last = Date.now(); store(BREAK_KEY, s); }
    return s;
  }

  function spotLoad(src) {
    if (cfg.ads === "0" || libOff(src.lib)) { src.items = []; src.byId = {}; src.note = "no " + src.label; return Promise.resolve(0); }
    var fresh = src.loadedAt && Date.now() - src.loadedAt < num(cfg.jfrefresh, 30) * 60000;
    var read = fresh ? Promise.resolve() : (jfState.userId ? Promise.resolve(jfState.userId) :
      jfJson("/Users/Me").then(function (me) { jfState.userId = me.Id; return me.Id; })
    ).then(function (uid) {
      return jfJson("/UserViews", { userId: uid }).then(function (views) {
        var want = src.lib.toLowerCase();
        var lib = (views.Items || []).filter(function (v) { return String(v.Name).toLowerCase() === want; })[0];
        if (!lib) { return { Items: [], missing: true }; }
        return jfJson("/Items", {
          userId: uid, parentId: lib.Id, recursive: "true",
          includeItemTypes: "Video,Movie,Episode,MusicVideo,Photo",
          fields: "MediaSources,Path", sortBy: "SortName", sortOrder: "Ascending"
        });
      });
    }).then(function (res) {
      src.all = (res.Items || []).filter(function (it) { return it.Type === "Photo" || (it.MediaSources && it.MediaSources.length); });
      src.missing = !!res.missing;
      src.failed = "";
      src.loadedAt = Date.now();
    }).catch(function (e) {
      console.warn("Could not load " + src.lib + ": " + (e.message || e));
      src.failed = e.message || String(e);
      src.loadedAt = Date.now();
    });
    return read.then(function () {
      // dates are checked at every break, so a promo drops off after its day without a reload
      var today = todayYmd();
      src.items = src.all.filter(function (it) { return inDateWindow(it, today); });
      src.byId = {};
      src.items.forEach(function (it) { src.byId[it.Id] = it; });
      src.note = src.failed ? src.lib + " could not load (" + src.failed + ")" :
        src.missing ? "no library named " + src.lib :
        src.items.length + " " + src.label + " in " + src.lib +
          (src.all.length > src.items.length ? " (" + (src.all.length - src.items.length) + " outside their dates)" : "");
      return src.items.length;
    });
  }

  function spotSecs(it) {
    if (it.Type === "Photo") { return Math.max(3, num(cfg.promosecs, 12)); }
    return it.RunTimeTicks ? it.RunTimeTicks / 1e7 : 60;
  }

  // The next items in a library's shuffle, up to maxSecs; at least min of them.
  // A break ends where a round ends, so nothing repeats inside one break.
  function spotPick(src, maxSecs, min) {
    var s = recall(src.key) || {};
    var have = src.byId;
    var queue = (s.queue || []).filter(function (id) { return have[id]; });
    if (!queue.length) {
      queue = jfShuffle(src.items.map(function (it) { return it.Id; }));
      if (queue.length > 1 && queue[0] === s.lastId) { queue.push(queue.shift()); }
    }
    var picked = [], total = 0;
    while (queue.length) {
      var it = have[queue[0]];
      var secs = spotSecs(it);
      if (picked.length >= min && total + secs > maxSecs) { break; }
      picked.push(it);
      total += secs;
      s.lastId = queue.shift();
    }
    s.queue = queue;
    store(src.key, s);
    return { items: picked, secs: total };
  }

  function breakDue() {
    return cfg.ads !== "0" && Date.now() - breakSaved().last >= num(cfg.adsevery, 15) * 60000;
  }

  function breakNote() {
    if (cfg.ads === "0") { debugLine("breaks", "turned off"); return; }
    var every = num(cfg.adsevery, 15);
    var mins = Math.max(0, Math.ceil((breakSaved().last + every * 60000 - Date.now()) / 60000));
    debugLine("breaks", (promoSrc.note || "checking " + promoSrc.lib) + ", " + (adSrc.note || "checking " + adSrc.lib) +
      "; every " + every + " min, " + (mins ? "next when a show ends " + mins + "+ min from now" : "next when this show ends"));
  }

  function buildBreak() {
    var s = breakSaved();
    s.last = Date.now();
    store(BREAK_KEY, s);
    var max = num(cfg.adsmax, 150);
    var promo = promoSrc.items.length ? spotPick(promoSrc, 0, 1) : { items: [], secs: 0 };
    var ads = adSrc.items.length ? spotPick(adSrc, max - promo.secs, promo.items.length ? 0 : 1) : { items: [], secs: 0 };
    return promo.items.concat(ads.items);
  }

  function playBreak(list, done) {
    var n = 0;
    (function next() {
      if (n >= list.length) {
        ccRun++;
        videoBox.innerHTML = "";
        jfState.video = null;
        breakNote();
        done();
        return;
      }
      var item = list[n++];
      var finished = false, watchdog = 0;
      function finish(why) {
        if (finished) { return; }
        finished = true;
        clearTimeout(watchdog);
        if (why) { console.warn("Break item skipped (" + why + "): " + item.Name); }
        next();
      }
      debugLine("breaks", "break, item " + n + " of " + list.length);
      if (item.Type === "Photo") {
        ccRun++;
        videoBox.innerHTML = "";
        jfState.video = null;
        debugLine("playing", item.Name);
        debugLine("captions", "none for this item");
        var img = new Image();
        img.className = "flyer";
        img.alt = item.Name;
        img.onload = function () {
          clearTimeout(watchdog);
          watchdog = setTimeout(function () { finish(""); }, spotSecs(item) * 1000);
        };
        img.onerror = function () { finish("image failed to load"); };
        watchdog = setTimeout(function () { finish("image took too long"); }, 30000);
        img.src = jfUrl("/Items/" + item.Id + "/Images/Primary", { maxWidth: "1920", quality: "90" });
        videoBox.appendChild(img);
        return;
      }
      var v = jfVideoFor(item);
      // never let a stuck spot hold up the screen
      watchdog = setTimeout(function () { finish("took too long"); }, (spotSecs(item) + 30) * 1000);
      v.addEventListener("ended", function () { finish(""); });
      v.addEventListener("error", function () { finish("error " + (v.error ? v.error.code : "?")); });
      videoBox.appendChild(v);
      jfState.video = v;
      playOrMute(v);
    })();
  }

  function afterShow() {
    var due = breakDue();
    var check = due ? Promise.all([spotLoad(promoSrc), spotLoad(adSrc)]) : Promise.resolve([0, 0]);
    check.then(function (counts) {
      if (due && (counts[0] || counts[1])) {
        playBreak(buildBreak(), jfPlayNext);
      } else if (triviaDue()) {
        playTrivia(jfPlayNext);
      } else {
        triviaNote();
        breakNote();
        jfPlayNext();
      }
    });
  }

  function startJellyfin() {
    jfState.items = [];
    window.addEventListener("pagehide", jfSave);
    triviaNote();
    Promise.all([spotLoad(promoSrc), spotLoad(adSrc)]).then(breakNote);
    jfPlayNext();
  }

  function startVideo() {
    if (cfg.jftoken) { startJellyfin(); return; }
    if (cfg.stream) { startStream(); return; }
    videoBox.innerHTML = "";
    var src = youtubeSrc();
    if (!src) { return; } // stays black, ready for a hardware PiP window on top
    var f = document.createElement("iframe");
    f.src = src;
    f.allow = "autoplay; encrypted-media; picture-in-picture";
    f.referrerPolicy = "strict-origin-when-cross-origin";
    f.title = "Video";
    videoBox.appendChild(f);
  }
  startVideo();
  var vr = num(cfg.videorefresh, 240);
  if (vr > 0 && !cfg.jftoken && (cfg.stream || youtubeSrc())) { setInterval(startVideo, vr * 60000); }

  // ---------- Right panel ----------
  var side = $("side");

  function startWeb() {
    var z = num(cfg.webzoom, 1);
    if (z <= 0) { z = 1; }
    var w = side.clientWidth, h = side.clientHeight;
    side.innerHTML = "";
    var f = document.createElement("iframe");
    f.src = cfg.web;
    f.title = "Web page";
    f.style.width = (w / z) + "px";
    f.style.height = (h / z) + "px";
    f.style.transform = "scale(" + z + ")";
    side.appendChild(f);
  }

  // Weather icons: simple white shapes so they look the same on every player
  function svg(inner) {
    return '<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3.5" ' +
      'stroke-linecap="round" stroke-linejoin="round">' + inner + "</svg>";
  }
  var CLOUD = '<g fill="#fff" stroke="none"><circle cx="24" cy="38" r="10"/><circle cx="36" cy="30" r="13"/>' +
    '<circle cx="46" cy="38" r="10"/><rect x="24" y="36" width="22" height="12"/></g>';
  var SUN = '<g stroke="#ffd54a"><circle cx="32" cy="32" r="11" fill="#ffd54a" stroke="none"/>' +
    '<path d="M32 6v7M32 51v7M6 32h7M51 32h7M13.6 13.6l5 5M45.4 45.4l5 5M13.6 50.4l5-5M45.4 18.6l5-5"/></g>';
  var MOON = '<path fill="#f1ecc8" stroke="none" d="M40 8A24 24 0 1 0 56 44A19 19 0 0 1 40 8Z"/>';
  var ICONS = {
    sun: svg(SUN),
    moon: svg(MOON),
    cloud: svg(CLOUD),
    partlyDay: svg('<g transform="translate(-6,-8) scale(0.75)">' + SUN + "</g>" +
      '<g transform="translate(6,10) scale(0.9)">' + CLOUD + "</g>"),
    partlyNight: svg('<g transform="translate(-2,-4) scale(0.6)">' + MOON + "</g>" +
      '<g transform="translate(6,10) scale(0.9)">' + CLOUD + "</g>"),
    rain: svg('<g transform="translate(0,-8)">' + CLOUD + "</g>" +
      '<path d="M24 46l-4 10M34 46l-4 10M44 46l-4 10"/>'),
    storm: svg('<g transform="translate(0,-8)">' + CLOUD + "</g>" +
      '<path fill="#ffd54a" stroke="none" d="M35 40L24 54h8l-4 10 14-16h-8l4-8z"/>'),
    snow: svg('<g transform="translate(0,-8)">' + CLOUD + "</g>" +
      '<g fill="#fff" stroke="none"><circle cx="22" cy="50" r="2.6"/><circle cx="34" cy="53" r="2.6"/>' +
      '<circle cx="46" cy="50" r="2.6"/><circle cx="28" cy="60" r="2.6"/><circle cx="40" cy="60" r="2.6"/></g>'),
    fog: svg('<path d="M12 22h40M8 32h48M12 42h40M18 52h28"/>')
  };
  function iconFor(desc, isDay) {
    var d = (desc || "").toLowerCase();
    if (/thunder|t-storm|storm/.test(d)) { return ICONS.storm; }
    if (/snow|flurr|sleet|ice|freezing|wintry/.test(d)) { return ICONS.snow; }
    if (/rain|shower|drizzle/.test(d)) { return ICONS.rain; }
    if (/fog|haze|smoke|mist|dust/.test(d)) { return ICONS.fog; }
    if (/partly|mostly sunny|mostly clear|few clouds|becoming sunny|becoming clear/.test(d)) {
      return isDay ? ICONS.partlyDay : ICONS.partlyNight;
    }
    if (/cloud|overcast/.test(d)) { return ICONS.cloud; }
    return isDay ? ICONS.sun : ICONS.moon;
  }

  var wx = null;
  function buildWeather() {
    side.innerHTML = "";
    var box = el("div", "wx");
    box.appendChild(el("div", "wx-head", cfg.wxname));

    // Current conditions: icon, temperature, short description
    var now = el("div", "wx-now");
    var nowIcon = el("div", "wx-now-icon");
    var nowTemp = el("div", "wx-now-temp", "--");
    now.appendChild(nowIcon);
    now.appendChild(nowTemp);
    box.appendChild(now);
    var nowText = el("div", "wx-now-text");
    nowText.appendChild(el("div", "wx-now-label", "Right now"));
    var nowDesc = el("div", "wx-now-desc", "");
    nowText.appendChild(nowDesc);
    box.appendChild(nowText);

    var list = el("div", "wx-list");
    box.appendChild(list);
    var foot = el("div", "wx-foot", "Loading forecast...");
    box.appendChild(foot);
    side.appendChild(box);

    wx = { nowIcon: nowIcon, nowTemp: nowTemp, nowDesc: nowDesc, list: list, foot: foot };
  }

  // "Saturday Night" -> "Sat Night" so period names fit the narrow column
  function shortName(name) {
    return String(name || "").replace(/\b(Sun|Mon|Tues|Wednes|Thurs|Fri|Satur)day Night\b/, function (m, d) {
      return { Sun: "Sun", Mon: "Mon", Tues: "Tue", Wednes: "Wed", Thurs: "Thu", Fri: "Fri", Satur: "Sat" }[d] + " Night";
    });
  }

  function renderWeather(data, live) {
    if (!wx || !data) { return; }
    if (data.now) {
      wx.nowIcon.innerHTML = iconFor(data.now.desc, data.now.isDay !== false);
      wx.nowTemp.textContent = data.now.temp + "\u00B0";
      wx.nowDesc.textContent = data.now.desc;
    }
    wx.list.innerHTML = "";
    (data.periods || []).forEach(function (p) {
      var row = el("div", "wx-row");
      var ic = el("div", "i");
      ic.innerHTML = iconFor(p.desc, p.isDay);
      row.appendChild(ic);
      var n = el("div", "n");
      n.appendChild(el("b", "", shortName(p.name)));
      n.appendChild(el("small", "", p.desc));
      row.appendChild(n);
      var tp = el("div", "tp");
      tp.appendChild(el("div", "t", p.temp + "\u00B0"));
      if (p.pop) { tp.appendChild(el("div", "p", p.pop + "%")); }
      row.appendChild(tp);
      wx.list.appendChild(row);
    });
    var when = data.at ? fmtTime(new Date(data.at)) : "";
    wx.foot.textContent = live ? "NWS \u00B7 updated " + when
      : "Forecast offline \u00B7 last updated " + when;
  }

  var WX_KEY = "nths-signage-wx";
  function getJson(url) {
    return fetch(url, { cache: "no-store", headers: { "Accept": "application/geo+json" } })
      .then(function (r) { if (!r.ok) { throw new Error("HTTP " + r.status); } return r.json(); });
  }
  function loadWeather() {
    var base = "https://api.weather.gov/gridpoints/" + cfg.wx;
    Promise.all([
      getJson(base + "/forecast"),
      getJson(base + "/forecast/hourly").catch(function () { return null; })
    ]).then(function (res) {
      var periods = res[0].properties.periods.slice(0, 7).map(function (p) {
        return {
          name: p.name,
          desc: p.shortForecast,
          temp: p.temperature,
          unit: p.temperatureUnit,
          pop: p.probabilityOfPrecipitation && p.probabilityOfPrecipitation.value,
          isDay: p.isDaytime
        };
      });
      var h = res[1] && res[1].properties && res[1].properties.periods && res[1].properties.periods[0];
      var nowData = h ? { temp: h.temperature, desc: h.shortForecast, isDay: h.isDaytime }
        : { temp: periods[0].temp, desc: periods[0].desc, isDay: periods[0].isDay };
      var data = { at: Date.now(), now: nowData, periods: periods };
      store(WX_KEY, data);
      renderWeather(data, true);
    }).catch(function (e) {
      console.warn("Weather load failed:", e);
      var cached = recall(WX_KEY);
      if (cached) { renderWeather(cached, false); }
      else if (wx) { wx.foot.textContent = "Forecast unavailable right now"; }
    });
  }

  if (cfg.web) {
    startWeb();
    var wr = num(cfg.webrefresh, 15);
    if (wr > 0) { setInterval(startWeb, wr * 60000); }
  } else {
    buildWeather();
    var cachedWx = recall(WX_KEY);
    if (cachedWx) { renderWeather(cachedWx, false); }
    loadWeather();
    setInterval(loadWeather, Math.max(5, num(cfg.wxrefresh, 30)) * 60000);
  }

  // ---------- Announcements ticker (NTHS RSS feed on GitHub) ----------
  var track = $("ticker-track");
  var win = $("ticker-window");
  var speed = num(cfg.speed, 110);
  var trackW = 0;
  var x = null;
  var pending = null;
  var showingFallback = true;
  var RSS_KEY = "nths-signage-rss";

  function textOf(s) {
    if (!s) { return ""; }
    // Parse as inert HTML so entities decode and tags drop out, without running scripts or loading images
    var doc = new DOMParser().parseFromString(String(s), "text/html");
    return (doc.body.textContent || "").replace(/\s+/g, " ").trim();
  }

  function pick(block, tag) {
    var m = block.match(new RegExp("<" + tag + "[^>]*>([\\s\\S]*?)</" + tag + ">", "i"));
    if (!m) { return ""; }
    return m[1].replace(/^\s*<!\[CDATA\[/, "").replace(/\]\]>\s*$/, "");
  }

  function parseFeed(txt) {
    var out = [];
    var doc = new DOMParser().parseFromString(txt, "application/xml");
    if (!doc.querySelector("parsererror")) {
      var nodes = doc.querySelectorAll("item, entry");
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        var t = n.querySelector("title");
        var d = n.querySelector("description") || n.querySelector("summary") || n.querySelector("content");
        var item = { t: textOf(t && t.textContent), d: textOf(d && d.textContent) };
        if (item.t || item.d) { out.push(item); }
      }
    }
    if (!out.length) {
      // Tolerant fallback so one broken tag in the feed does not blank the ticker
      var blocks = txt.match(/<item[\s>][\s\S]*?(?=<item[\s>]|<\/channel>|$)/gi) || [];
      blocks.forEach(function (b) {
        var item = { t: textOf(pick(b, "title")), d: textOf(pick(b, "description")) };
        if (item.t || item.d) { out.push(item); }
      });
    }
    return out;
  }

  function renderTicker(list) {
    track.innerHTML = "";
    list.forEach(function (it) {
      var span = el("span");
      if (it.t) { span.appendChild(el("span", "t-title", it.t + (it.d ? ": " : ""))); }
      if (it.d) { span.appendChild(document.createTextNode(it.d)); }
      track.appendChild(span);
      track.appendChild(el("span", "t-sep", "\u2022"));
    });
    trackW = track.scrollWidth;
  }

  function accept(list) {
    if (!list || !list.length) { return; }
    if (showingFallback) {
      showingFallback = false;
      renderTicker(list);
      x = win.clientWidth;
    } else {
      pending = list;
    }
  }

  // Start with the last good feed this player saw, or the welcome message
  var cachedRss = recall(RSS_KEY);
  if (cachedRss && cachedRss.length) {
    renderTicker(cachedRss);
    showingFallback = false;
  } else {
    renderTicker([{ t: "", d: cfg.msg }]);
  }

  function loadRss() {
    if (!cfg.rss) { return; }
    var url = cfg.rss + (cfg.rss.indexOf("?") === -1 ? "?" : "&") + "_=" + Date.now();
    fetch(url, { cache: "no-store" })
      .then(function (r) { if (!r.ok) { throw new Error("HTTP " + r.status); } return r.text(); })
      .then(function (txt) {
        var list = parseFeed(txt);
        if (list.length) {
          store(RSS_KEY, list);
          accept(list);
        }
      })
      .catch(function (e) { console.warn("RSS load failed:", e); });
  }
  loadRss();
  setInterval(loadRss, Math.max(1, num(cfg.rssrefresh, 10)) * 60000);

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (x === null) { x = win.clientWidth; }
    x -= speed * dt;
    if (x < -trackW) {
      if (pending) { renderTicker(pending); pending = null; }
      x = win.clientWidth;
    }
    track.style.transform = "translate3d(" + x.toFixed(1) + "px,0,0)";
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- Pick up new versions of this page automatically ----------
  // Bump PAGE_VERSION whenever this file changes. Players compare it against the
  // copy on GitHub and reload (with a cache-busting parameter) when it differs.
  var PAGE_VERSION = "2026-11-18.3";
  debugLine("page", "version " + PAGE_VERSION);
  var su = num(cfg.selfupdate, 10);
  if (su > 0 && location.protocol.indexOf("http") === 0) {
    setInterval(function () {
      fetch(location.pathname + "?_=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.text() : ""; })
        .then(function (t) {
          var m = t.match(/var PAGE_VERSION = "([^"]+)"/);
          if (m && m[1] !== PAGE_VERSION) {
            var q = new URLSearchParams(location.search);
            q.set("_r", String(Date.now()));
            location.replace(location.pathname + "?" + q.toString());
          }
        })
        .catch(function () {});
    }, su * 60000);
  }

  // ---------- Daily full reload for long-run stability ----------
  var rh = parseInt(cfg.reloadhour, 10);
  if (rh >= 0 && rh <= 23) {
    var startedAt = Date.now();
    setInterval(function () {
      if (zoned(new Date()).h === rh && Date.now() - startedAt > 2 * 3600000) { location.reload(); }
    }, 60000);
  }
})();
</script>
</body>
</html>
